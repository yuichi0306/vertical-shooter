<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ゴリラ、また来た。</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a14;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: sans-serif;
        /* スマホで画面を引っぱったり二本指ズームしたりしないように */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* ゲーム画面（480x640）を、画面の縦横どちらにも収まるよう拡大表示する */
      #game {
        image-rendering: pixelated; /* 拡大時にドットをくっきり */
        /* 画面の幅と高さの小さい方に合わせる（スマホでも全体が見える） */
        width: min(100vw, 75vh); /* 75vh = 100vh × 480/640 */
        height: auto;
        aspect-ratio: 480 / 640;
        background: #000;
        box-shadow: 0 0 40px rgba(80, 120, 255, 0.3);
        touch-action: none; /* 指の操作をゲームだけに使う */
      }
      /* 画面のすみに置く「あそびかた」リンク（別タブで説明書を開く） */
      #help-link {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 10;
        text-decoration: none;
        color: #5cff9d;
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
        font-size: 13px;
        font-weight: bold;
        padding: 6px 12px;
        border: 1.5px solid rgba(92, 255, 157, 0.6);
        border-radius: 999px;
        background: rgba(10, 10, 20, 0.55);
        backdrop-filter: blur(2px);
      }
      #help-link:hover { background: rgba(92, 255, 157, 0.15); }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="640"></canvas>
    <a id="help-link" href="manual.html" target="_blank">📖 あそびかた</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
