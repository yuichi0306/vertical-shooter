<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>縦スクロール シューティング</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a14;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: sans-serif;
      }
      /* ゲーム画面（480x640）を、ウィンドウの高さに合わせて拡大表示する */
      #game {
        image-rendering: pixelated; /* 拡大時にドットをくっきり */
        height: 100vh;
        max-height: 100vh;
        aspect-ratio: 480 / 640;
        background: #000;
        box-shadow: 0 0 40px rgba(80, 120, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="640"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
