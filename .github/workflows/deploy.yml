# GitHubにpushするたびに、自動でビルドしてGitHub Pagesに公開する設定。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # main ブランチが更新されたら実行
  workflow_dispatch: # 手動実行も可能にする

# Pages への書き込みに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数走らないように
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist # Viteが出力する公開用フォルダ

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
